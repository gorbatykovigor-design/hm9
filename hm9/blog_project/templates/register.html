<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
</head>
<body>
    <h1>Реєстрація</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Зареєструватися</button>
    </form>

    <a href="{% url 'login' %}">Увійти</a>

<form method="POST" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Вийти</button>
</form>
</body>
</html>
